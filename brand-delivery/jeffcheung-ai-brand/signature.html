<!--
  jeffcheung.ai — email signature
  Table-based + inline styles on purpose: Outlook desktop's rendering
  engine (Word) does not support flexbox, CSS grid, or external
  stylesheets/webfonts in signatures. This will hold up in Outlook,
  Gmail, Apple Mail, and everything between them. Don't "clean this up"
  into flex — it'll silently break in Outlook only, which is the one
  client you can't preview from a Mac.

  Swap SIGNATURE_MARK_URL for the hosted, stable URL of
  signature-mark-104.png once it's deployed (e.g.
  https://jeffcheung.ai/assets/signature-mark-104.png). It must be a
  public, permanent URL — email clients cache but don't bundle images.
-->
<table cellpadding="0" cellspacing="0" border="0" style="font-family: Arial, Helvetica, sans-serif;">
  <tr>
    <td style="padding-bottom: 16px; font-size: 14px; line-height: 1.6; color: #3A3E42;">
      Happy to walk through the assessment whenever works for you.<br>Best,
    </td>
  </tr>
  <tr>
    <td>
      <table cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td style="width: 52px; padding-right: 16px;" valign="middle">
            <img src="SIGNATURE_MARK_URL" width="52" height="52" alt="jc" style="display: block; border: 0; border-radius: 12px;">
          </td>
          <td style="width: 1px; background-color: #DCDBD5; padding-right: 16px;" valign="middle">
            <div style="width: 1px; height: 44px; background-color: #DCDBD5; font-size: 0; line-height: 0;">&nbsp;</div>
          </td>
          <td valign="middle">
            <div style="font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: bold; color: #14171A;">Jeff Cheung</div>
            <div style="font-family: Arial, Helvetica, sans-serif; font-size: 13px; color: #6B7178; padding-top: 2px;">AI Consultant</div>
            <div style="font-family: monospace; font-size: 12px; padding-top: 4px;">
              <a href="https://jeffcheung.ai" style="color: #1F6E66; text-decoration: none;">jeffcheung.ai</a>
              <span style="color: #C8C7C1;"> &middot; </span>
              <span style="color: #6B7178;">Vermont, US</span>
            </div>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
